<!DOCTYPE html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<head>
    <meta charset="UTF-8">
    <title>圣诞节｜效果展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b1524;
        }

        /* ===== 下雪背景画布 ===== */
        #snowCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== 弹窗基础样式 ===== */
        .xmas-popup {
            position: fixed;
            padding: 16px 22px;
            border-radius: 12px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 99;
            pointer-events: none;
            white-space: nowrap;
            transform: scale(0);
            transform-origin: center center;
            opacity: 0;
            will-change: transform, opacity;
            backface-visibility: hidden;

            --pop-speed: 300ms;
            --pop-out-speed: 200ms;
        }

        /* 入场：果冻回弹 */
        .xmas-popup.pop-in {
            animation: popIn var(--pop-speed, 300ms) linear both;
        }

        /* 退场：先胀一下再缩没 */
        .xmas-popup.pop-out {
            animation: popOut var(--pop-out-speed, 200ms) linear both;
        }

        @keyframes popIn {
            0%   { transform: scale(0.2) rotate(-6deg);  opacity: 0; }
            18%  { opacity: 1; }
            32%  { transform: scale(1.14) rotate(3deg); }
            50%  { transform: scale(0.94) rotate(-1.6deg); }
            66%  { transform: scale(1.06) rotate(0.9deg); }
            80%  { transform: scale(0.975) rotate(-0.4deg); }
            91%  { transform: scale(1.015) rotate(0.15deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes popOut {
            0%   { transform: scale(1) rotate(0deg);    opacity: 1; }
            30%  { transform: scale(1.08) rotate(-2deg); opacity: 1; }
            100% { transform: scale(0) rotate(6deg);     opacity: 0; }
        }

        /* ===== 底部按钮：分享 + 返回 ===== */
        .back-wrap {
            position: fixed;
            left: 20px; right: 20px;
            bottom: calc(20px + env(safe-area-inset-bottom));
            max-width: 900px; margin: 0 auto;
            z-index: 999;
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 12px;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .back-wrap.hide-btn {
            opacity: 0;
            pointer-events: none;
        }
        .back-wrap button {
            width: 100%;
            padding: 14px 8px;
            border-radius: 10px;
            font-size: 1rem;
            touch-action: manipulation;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform .2s ease, box-shadow .25s ease;
        }
        .back-wrap button:active { transform: scale(.97); }

        /* 分享：暖金 */
        .back-wrap .btn-share {
            background: rgba(255, 214, 130, 0.22);
            color: #fff3d6;
            border: 1px solid rgba(255, 228, 168, 0.55);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35),
            0 4px 18px rgba(255,196,90,0.28);
            text-shadow: 0 1px 2px rgba(90,55,0,0.5);
        }

        /* 返回：冰蓝 */
        .back-wrap .btn-back {
            background: rgba(170, 215, 255, 0.22);
            color: #eaf6ff;
            border: 1px solid rgba(200, 235, 255, 0.45);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35),
            0 4px 18px rgba(120,190,255,0.25);
            text-shadow: 0 1px 2px rgba(0,40,80,0.45);
        }

        /* ===== 轻提示 toast ===== */
        .toast {
            position: fixed;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(.92);
            background: rgba(10, 22, 38, 0.88);
            color: #eaf6ff;
            padding: 14px 22px;
            border-radius: 12px;
            border: 1px solid rgba(180, 220, 255, 0.3);
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            max-width: 82vw;
            word-break: break-all;
            white-space: pre-line;
            z-index: 10001;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 480px) {
            .xmas-popup { font-size: 0.78rem; padding: 8px 12px; border-radius: 8px; }
            .back-wrap button { font-size: .92rem; padding: 12px 6px; }
            .back-wrap { grid-template-columns: 1fr 1.3fr; gap: 10px; }
        }

        /* ===== 音频降级提示：全屏点击播放 ===== */
        #playPrompt {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.55);

            font-size: 18px;
            letter-spacing: 1px;
            text-align: center;
            z-index: 10000;

            touch-action: manipulation;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);

            -webkit-user-select: none;

            0%, 100% { background-color: rgba(0, 0, 0, 0.55); }
            50%      { background-color: rgba(0, 0, 0, 0.70); }
        }
    </style>
</head>

    /* ============================================================
       统一后退函数
       ============================================================ */
    function goBack(fallback) {
        var fromSameSite = false;
        if (document.referrer) {
            try {
                fromSameSite = new URL(document.referrer).origin === location.origin;
            } catch (e) {
                fromSameSite = document.referrer.indexOf(location.hostname) !== -1 && location.hostname !== '';
            }
        }
        if (fromSameSite && history.length > 1) {
            history.back();
        } else {
            location.href = fallback;
        }
    }

    /* ============================================================
       🔗 分享工具：把设置编码进 URL，任何人打开即还原相同效果
       ============================================================ */
    function encodeShareToken(obj) {
        try {
            const bytes = new TextEncoder().encode(JSON.stringify(obj));
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        } catch (e) {
            return '';
        }
    }

    function decodeShareToken(token) {
        let s = String(token).replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return JSON.parse(new TextDecoder().decode(bytes));
    }

    function readSettingFromUrl() {
        const raw = (location.hash || '').replace(/^#/, '');
        if (!raw) return null;
        try {
            const token = new URLSearchParams(raw).get('s');
            if (!token) return null;
            const obj = decodeShareToken(token);
            return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : null;
        } catch (e) {
            console.warn('分享参数解析失败', e);
            return null;
        }
    }

    /* ============================================================
       ❄️ 下雪背景（独立模块）
       ============================================================ */
    (function initSnow() {
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];
        let rafId = null;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width  = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width  = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function createFlakes() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const count = Math.max(60, Math.min(120, Math.floor(w / 6)));
            flakes = [];
            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2 + 0.6,
                    speed: Math.random() * 0.6 + 0.3,
                    drift: (Math.random() - 0.5) * 0.3,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.01 + 0.005,
                    opacity: Math.random() * 0.5 + 0.4
                });
            }
        }

        function draw() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < flakes.length; i++) {
                const f = flakes[i];
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + f.opacity + ')';
                ctx.fill();

                f.y += f.speed;
                f.x += Math.sin(f.sway) * 0.4 + f.drift;
                f.sway += f.swaySpeed;

                if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
                if (f.x > w + 5) f.x = -5;
                if (f.x < -5)     f.x = w + 5;
            }
            rafId = requestAnimationFrame(draw);
        }

        function handleResize() {
            resizeCanvas();
            createFlakes();
        }

        resizeCanvas();
        createFlakes();
        draw();

        window.addEventListener('resize', handleResize);
        window.addEventListener('beforeunload', () => {
            if (rafId) cancelAnimationFrame(rafId);
        });
    })();

    // 自定义了几条就用几条（不混入默认随机库）；完全没自定义才用默认池
    let textList = hasCustomText ? customTextsArr.slice() : defaultTextPool.slice();
    if (textList.length === 0) textList = ["圣诞快乐"];

    /* ============================================================
       🎲 随机表情装饰
       ============================================================ */
    const EMOJI_POOL = ["🎄","❄️","🎅","🎁","🔔","☃️","⛄","✨","🌟","🦌","🕯️","🍬","🧦","🛷","🎀"];
    function startsWithEmoji(str) {
        if (!str) return false;
        const cp = str.codePointAt(0);
        return (
            (cp >= 0x1F000 && cp <= 0x1FAFF) ||
            (cp >= 0x2600  && cp <= 0x27BF)  ||
            (cp >= 0x2B00  && cp <= 0x2BFF)  ||
            (cp >= 0xFE00  && cp <= 0xFE0F)  ||
            (cp >= 0x1F1E6 && cp <= 0x1F1FF)
        );
    }
    function randomEmoji() {
        return EMOJI_POOL[Math.floor(Math.random() * EMOJI_POOL.length)];
    }

    function decorate(raw) {
        let body = raw;
        if (hasCustomText && !startsWithEmoji(body)) {
            body = randomEmoji() + " " + body;
        }
        if (userName) {
            body = randomEmoji() + userName + "，" + body;
        }
        return body;
    }

    const bgMusic = document.getElementById('bgMusic');
    let timerId = null;
    let isLeaving = false;
    const pool = [];
    let activeNodes = [];

    // ===== 返回 / 分享按钮：自动隐藏、点击再出现 =====
    const backWrap = document.getElementById('backWrap');
    const btnBack  = document.getElementById('btnBack');
    const btnShare = document.getElementById('btnShare');
    let backHideTimer = null;
    let backPeTimer = null;                 // ★ 新增
    let backBtnLockUntil = 0;
    const BACK_HIDE_DELAY = 3000;
    const BACK_WAKE_LOCK  = 500;            // ★ 450 → 500

    // ★ 是否从分享链接进入：URL 带 #s= 参数
    const isFromShare = !!urlSetting;

    function scheduleBackHide() {
        clearTimeout(backHideTimer);
        const wasHidden = backWrap.classList.contains('hide-btn');   // ★
        if (wasHidden) {
            backBtnLockUntil = performance.now() + BACK_WAKE_LOCK;
            // ★ 关键：按钮从隐藏变可见时短暂禁用 pointer-events，防止 click 穿透
            backWrap.style.pointerEvents = 'none';
            clearTimeout(backPeTimer);
            backPeTimer = setTimeout(() => {
                backWrap.style.pointerEvents = '';
            }, 300);
        }
        backWrap.classList.remove('hide-btn');
        backHideTimer = setTimeout(() => {
            backWrap.classList.add('hide-btn');
        }, BACK_HIDE_DELAY);
    }

    scheduleBackHide();

    /* ============================================================
       🔗 分享：一键生成可直接打开的链接
       ============================================================ */
    let toastTimer = null;
    function showToast(msg, duration) {
        let el = document.getElementById('shareToast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'shareToast';
            el.className = 'toast';
            document.body.appendChild(el);
        }
        el.textContent = msg;
        void el.offsetWidth;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2400);
    }

    function buildShareLink() {
        const base = location.href.split('#')[0];
        const token = encodeShareToken(setting);
        return base + '#s=' + token;
    }

    function fallbackCopy(text, okMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        if (ok) showToast(okMsg, 2600);
        else window.prompt('请长按全选并复制下面的链接：', text);
    }

    function copyText(text, okMsg) {
        const msg = okMsg || '✅ 分享链接已复制\n发给朋友即可打开';
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text)
                .then(() => showToast(msg, 2600))
                .catch(() => fallbackCopy(text, msg));
        } else {
            fallbackCopy(text, msg);
        }
    }

    btnShare.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (performance.now() < backBtnLockUntil) {     // ★ 防穿透
            e.preventDefault();
            return;
        }
        if (isFromShare) {                              // ★ 分享链接进来不允许再分享
            showToast('分享链接不支持分享');
            return;
        }
        const link = buildShareLink();
        const tooLong = link.length >= 1800;

        if (navigator.share && !tooLong) {
            try {
                await navigator.share({
                    title: '🎄 送你一份圣诞祝福',
                    text: '点开看看这份圣诞祝福吧～',
                    url: link
                });
                return;
            } catch (err) {
                if (err && err.name === 'AbortError') return;
            }
        }

        if (tooLong) {
            copyText(link, '⚠️ 内容较多，链接较长\n已复制，若发送失败可减少自定义祝福语');
        } else {
            copyText(link);
        }
    });
    btnShare.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

    function tryResumeMusic() {
        if (musicFile === "off" || !bgMusic.paused) return;
        bgMusic.play().then(() => {
            const p = document.getElementById('playPrompt');
            if (p) p.remove();
        }).catch(() => {});

        if (e.target === btnBack || btnBack.contains(e.target)) return;
        if (e.target === btnShare || btnShare.contains(e.target)) return;
        scheduleBackHide();
        tryResumeMusic();
    });

    document.body.addEventListener('touchstart', (e) => {
        if (e.target === btnBack || btnBack.contains(e.target)) return;
        if (e.target === btnShare || btnShare.contains(e.target)) return;
        scheduleBackHide();
    }, { passive: true });

    document.body.addEventListener('touchend', tryResumeMusic, { passive: true });

    // ===== 弹窗池 =====
    function getPopupEl() {
        if (pool.length > 0) {
            const el = pool.pop();
            el.classList.remove('pop-in', 'pop-out');
            return el;
        }
        const el = document.createElement('div');
        el.className = "xmas-popup";
        return el;
    }

    function recycle(el) {
        if (isLeaving) return;
        el.classList.remove('pop-in', 'pop-out');
        el.innerText = "";
        if (el.parentNode) el.remove();
        pool.push(el);
    }

    /* ============================================================
       🎵 背景音乐：自动播放 + 失败降级
       ============================================================ */
    function showPlayPrompt() {
        if (document.getElementById('playPrompt')) return;
        const prompt = document.createElement('div');
        prompt.id = 'playPrompt';
        prompt.innerText = '🎵 点击任意地方播放音乐';
        document.body.appendChild(prompt);

        let handled = false;
        function startPlay(e) {
            if (handled) return;
            handled = true;
            if (e && e.type === 'touchend' && e.cancelable) e.preventDefault();
            bgMusic.play().then(() => {
                console.log('✅ 点击后播放成功');
            }).catch(err => console.warn('⚠️ 点击后依然无法播放:', err));
            prompt.remove();
        }
        prompt.addEventListener('touchend', startPlay, { passive: false });
        prompt.addEventListener('click', startPlay);
    }

    function tryPlayMusic() {
        bgMusic.play().then(() => {
            console.log('✅ 背景音乐自动播放成功');
            const p = document.getElementById('playPrompt');
            if (p) p.remove();
        }).catch((err) => {
            console.warn('⚠️ 自动播放被浏览器阻止:', err);
            showPlayPrompt();
        });
    }

    if (musicFile !== "off") {
        bgMusic.src = `static/${musicFile}`;
        tryPlayMusic();
        window.addEventListener('load', tryPlayMusic, { once: true });
    }

    // ===== 弹窗生成 =====
    function createPopup() {
        if (isLeaving || document.hidden) return;
        if (activeNodes.length >= MAX_POP) return;

        const el = getPopupEl();
        const randText = textList[Math.floor(Math.random() * textList.length)];
        el.innerText = decorate(randText);
        el.style.color = textColor;

        el.style.left = "-9999px";
        el.style.top  = "-9999px";
        document.body.appendChild(el);

        const popW = el.offsetWidth;
        const popH = el.offsetHeight;

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        const overhang = popW * 0.5;
        const minX = -overhang;
        const maxX = screenW - popW + overhang;

        const minY = -popH * 0.3;
        const maxY = screenH - popH * 0.7;

        const x = minX + Math.random() * (maxX - minX);
        const y = minY + Math.random() * (maxY - minY);

        el.style.left = x + "px";
        el.style.top  = y + "px";

        el.style.setProperty('--pop-speed', speed + 'ms');
        el.style.setProperty('--pop-out-speed', outSpeed + 'ms');

        el.classList.remove('pop-in', 'pop-out');
        void el.offsetWidth;
        el.classList.add('pop-in');

        activeNodes.push(el);

        setTimeout(() => {
            if (isLeaving) return;
            el.classList.remove('pop-in');
            el.classList.add('pop-out');
            setTimeout(() => {
                if (isLeaving) return;
                const idx = activeNodes.indexOf(el);
                if (idx > -1) activeNodes.splice(idx, 1);
                recycle(el);
            }, outSpeed);
        }, liveTime);
    }

    timerId = setInterval(createPopup, interval);

    // ===== 返回按钮点击（带防误触判断）=====
    btnBack.addEventListener('click', (e) => {
        if (performance.now() < backBtnLockUntil) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        if (isFromShare) {                              // ★ 分享链接进来不允许改参数
            showToast('分享链接不支持更改参数');
            return;
        }
        isLeaving = true;
        clearInterval(timerId);
        clearTimeout(backHideTimer);
        clearTimeout(backPeTimer);                      // ★
        bgMusic.pause();
        goBack('page4.html');
    });

    window.addEventListener('beforeunload', () => {
        isLeaving = true;
        clearInterval(timerId);
        clearTimeout(backHideTimer);
        clearTimeout(backPeTimer);                      // ★
        bgMusic.pause();
    });

    /* ============================================================
       从 bfcache 恢复时（浏览器后退回本页），重置状态
       ============================================================ */
    window.addEventListener('pageshow', (e) => {
        if (!e.persisted) return;
        isLeaving = false;
        for (let i = activeNodes.length - 1; i >= 0; i--) {
            if (activeNodes[i].parentNode) activeNodes[i].remove();
        }
        activeNodes.length = 0;
        pool.length = 0;
        if (musicFile !== "off" && bgMusic.paused) {
            bgMusic.play().catch(() => {});
        }
        scheduleBackHide();
    });
